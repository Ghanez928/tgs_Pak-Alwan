name: C++ to Excel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Mengambil kode repository
        uses: actions/checkout@v4

      - name: Menyiapkan compiler C++
        run: |
          g++ main.cpp -o main

      - name: Menyiapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Memasang library
        run: |
          pip install -r requirements.txt

      - name: Menjalankan program C++ dan membuat Excel
        run: |
          python main.py

      - name: Mengunggah hasil Excel
        uses: actions/upload-artifact@v4
        with:
          name: hasil-excel
          path: hasil.xlsx
